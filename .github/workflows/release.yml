name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish niffler_precompiled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19.2"

      - name: Check tag matches gleam.toml
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TOML_VERSION="$(grep -E '^version = ' gleam.toml | head -n1 | cut -d'"' -f2)"
          test "$VERSION" = "$TOML_VERSION" || {
            echo "tag $GITHUB_REF_NAME does not match gleam.toml version $TOML_VERSION" >&2
            exit 1
          }
          grep -q "pub const version = \"$VERSION\"" src/niffler_precompiled.gleam

      - name: Download dependencies
        run: gleam deps download

      - name: Checks
        run: |
          gleam format --check src test
          gleam build --warnings-as-errors
          gleam test

      - name: Build standalone escript
        run: bash scripts/build_escript.sh

      - name: Escript smoke test
        run: ./niffler.escript --version

      - name: Validate Hex package
        run: gleam export hex-tarball

      - name: Checksums
        run: |
          sha256sum niffler.escript > niffler.escript.sha256
          sha256sum build/niffler_precompiled-*.tar > niffler_precompiled.tar.sha256

      - name: Check Hex publication status
        id: hex
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hex.pm/api/packages/niffler_precompiled/releases/$VERSION")"
          if [ "$STATUS" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Hex version $VERSION is already published; skipping the publish step."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Hex
        if: steps.hex.outputs.published != 'true'
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${HEXPM_API_KEY:-}" ]; then
            echo "::error::HEXPM_API_KEY is not configured; cannot publish $VERSION"
            exit 1
          fi
          if [[ "$VERSION" == 0.* ]]; then
            printf 'I am not using semantic versioning\n' | gleam publish --yes
          else
            gleam publish --yes
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            niffler.escript
            niffler.escript.sha256
            build/niffler_precompiled-*.tar
            niffler_precompiled.tar.sha256
          generate_release_notes: true
